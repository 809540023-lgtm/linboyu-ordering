# ===== 纖體食驗室 × 林博御AI膳 — Docker Compose =====
# 使用方式：docker compose up -d

version: '3.8'

services:
  # ===== 主應用 =====
  app:
    build: .
    container_name: linboyu-ordering
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      # 資料庫持久化（重要！）
      - ./db:/app/db
      # 環境變數
      - ./.env:/app/.env:ro
    environment:
      - NODE_ENV=production
      - TZ=Asia/Taipei
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app-network

  # ===== Nginx 反向代理（含 SSL）=====
  nginx:
    image: nginx:alpine
    container_name: linboyu-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./public:/usr/share/nginx/html:ro
    depends_on:
      - app
    networks:
      - app-network

  # ===== 自動 SSL 憑證（Let's Encrypt）=====
  certbot:
    image: certbot/certbot
    container_name: linboyu-certbot
    volumes:
      - ./nginx/ssl:/etc/letsencrypt
      - ./nginx/certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    profiles:
      - ssl  # 只在需要 SSL 時啟用：docker compose --profile ssl up -d

networks:
  app-network:
    driver: bridge
