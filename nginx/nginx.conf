# ===== 纖體食驗室 × 林博御AI膳 — Nginx 設定 =====
# 反向代理 + SSL + 安全性 + 快取

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 日誌格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # 限流（防 DDoS）
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=order:10m rate=2r/s;

    # ===== 上游伺服器 =====
    upstream app_server {
        server app:3000;
    }

    # ===== HTTP → HTTPS 重定向 =====
    server {
        listen 80;
        server_name order.linboyu.com linboyu.com;

        # Let's Encrypt 驗證
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # 重定向到 HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ===== HTTPS 主站 =====
    server {
        listen 443 ssl http2;
        server_name order.linboyu.com;

        # SSL 憑證（Let's Encrypt）
        ssl_certificate /etc/nginx/ssl/live/order.linboyu.com/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/order.linboyu.com/privkey.pem;

        # SSL 安全設定
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # 安全標頭
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # 請求大小限制
        client_max_body_size 10M;

        # ===== 靜態檔案快取 =====
        location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2)$ {
            proxy_pass http://app_server;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # ===== API 限流 =====
        location /api/orders {
            limit_req zone=order burst=5 nodelay;
            proxy_pass http://app_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://app_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ===== 金流回調（不限流）=====
        location /api/payments/ {
            proxy_pass http://app_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ===== LINE Webhook（不限流）=====
        location /api/line/webhook {
            proxy_pass http://app_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ===== 主站 =====
        location / {
            proxy_pass http://app_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ===== 後台限制 IP（建議啟用）=====
        # location /admin.html {
        #     allow 你的固定IP;
        #     deny all;
        #     proxy_pass http://app_server;
        # }
    }

    # ===== 無 SSL 版本（開發/測試用）=====
    # 如果還沒有 SSL 憑證，先用這段
    # 把上面的 HTTPS server 區塊註解掉，把這段打開
    #
    # server {
    #     listen 80;
    #     server_name _;
    #
    #     location / {
    #         proxy_pass http://app_server;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     }
    # }
}
